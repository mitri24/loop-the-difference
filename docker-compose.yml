name: skyshift

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment: &backend-environment
    SKYSHIFT_REDIS_URL: redis://redis:6379/0
    SKYSHIFT_CACHE_DIR: /data/cache
  volumes:
    - cache:/data/cache
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  web:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Scale with: docker compose up --scale worker=4
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-environment
      SKYSHIFT_WORKER_QUEUES: frames

  # Spectra download ~100 cutouts and take minutes: a worker of their own, so they never delay a frame job.
  worker-slow:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-environment
      SKYSHIFT_WORKER_QUEUES: slow

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  cache:
