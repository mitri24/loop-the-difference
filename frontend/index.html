<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Loop the Difference shows NASA SPHEREx images of one patch of sky over time, so moving and changing objects stand out." />
    <link rel="icon" type="image/png" href="/src/assets/logo-loop.png" />
    <title>Loop the Difference</title>
    <script>
      // The intro (src/intro.ts) plays once per tab; never embedded, and not for automated browsers unless ?intro=1
      // asks for it. Decided before the first paint, so a skipped intro never flashes.
      try {
        var query = location.search
        var forced = /[?&]intro=1(&|$)/.test(query)
        if (/[?&]embed=1(&|$)/.test(query) || (!forced && (navigator.webdriver || sessionStorage.getItem('ltd-intro-seen')))) {
          document.documentElement.classList.add('intro-off')
        }
      } catch (error) {
        document.documentElement.classList.add('intro-off')
      }
    </script>
    <style>
      /* The intro, inline so it shows while the app loads: the logo's orbits run (loading); once the app has
         rendered (.intro--play) they close, the planets blink from an earlier to their present position (as the
         blink shows moving objects) and the name appears; then the logo opens onto the workspace (.intro--open).
         Logo geometry fitted to src/assets/logo-loop.png (144 × 168). */
      .intro { position:fixed; inset:0; z-index:1000; display:grid; place-items:center; background:radial-gradient(ellipse at 50% 43%, #192129 0%, #0b0e10 58%); cursor:pointer; perspective:850px;
        animation:intro-gone .4s ease-out 20s forwards; }
      .intro-off .intro { display:none; }
      .intro-logo { width:min(46vmin, 300px); height:auto; overflow:visible; transform-origin:50.7% 32%; filter:drop-shadow(0 18px 14px #0008);
        animation:intro-depth 4.6s cubic-bezier(.22,.65,.3,1) both; }
      .intro-logo * { transform-box:view-box; }
      .intro-orbit { fill:none; stroke:url(#intro-ring-light); stroke-width:1.1; stroke-linecap:round; stroke-dasharray:22 78;
        animation:intro-run 1.6s linear infinite; }
      .intro-orbit.inner { animation-duration:1.1s; animation-direction:reverse; }
      .intro-a, .intro-b, .intro-loop, .intro-rule, .intro-sub { opacity:0; }
      .intro-loop, .intro-sub { fill:#d4d5d6; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
      .intro-loop { font-size:28px; font-weight:800; letter-spacing:3px; }
      .intro-sub { font-size:9.6px; font-weight:600; letter-spacing:3.4px; }
      .intro-rule { stroke:#d4d5d6; stroke-opacity:.55; stroke-width:.8; transform-origin:72px 149.5px; }
      .intro--play .intro-orbit { animation:intro-draw .6s ease-out forwards; }
      .intro--play .intro-a { animation:intro-blink-a .9s steps(1, end) .35s both; }
      .intro--play .intro-b { animation:intro-blink-b .9s steps(1, end) .35s both; }
      .intro--play .intro-loop { animation:intro-rise .45s ease-out .95s both; }
      .intro--play .intro-rule { animation:intro-rule .45s ease-out 1.05s both; }
      .intro--play .intro-sub { animation:intro-spread .5s ease-out 1.1s both; }
      .intro--open { pointer-events:none; animation:intro-gone .7s ease-in forwards; }
      .intro--open .intro-logo { animation:intro-zoom .7s cubic-bezier(.55, 0, .85, .35) forwards; }
      .intro--open .intro-orbit { stroke-dasharray:none; animation:none; }
      .intro--open .intro-b, .intro--open .intro-loop, .intro--open .intro-rule, .intro--open .intro-sub { opacity:1; animation:none; }
      .intro-ground { fill:#000; opacity:.35; filter:blur(4px); }
      .intro-planet { stroke:#fff; stroke-opacity:.16; stroke-width:.25; }
      @keyframes intro-depth {
        0% { transform:rotateX(24deg) rotateY(-28deg) rotateZ(-5deg) translateZ(-55px); }
        45% { transform:rotateX(-8deg) rotateY(16deg) rotateZ(2deg) translateZ(20px); }
        100% { transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg) translateZ(0); }
      }
      @keyframes intro-run { to { stroke-dashoffset:-100; } }
      @keyframes intro-draw { to { stroke-dasharray:100 0; } }
      /* A, B, A, B and B stays: the planets jump along their orbits like moving objects in the blink. */
      @keyframes intro-blink-a { 0% { opacity:1; } 22% { opacity:0; } 44% { opacity:1; } 66%, 100% { opacity:0; } }
      @keyframes intro-blink-b { 0% { opacity:0; } 22% { opacity:1; } 44% { opacity:0; } 66%, 100% { opacity:1; } }
      @keyframes intro-rise { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }
      @keyframes intro-rule { from { opacity:0; transform:scaleX(0); } to { opacity:1; transform:none; } }
      @keyframes intro-spread { from { opacity:0; letter-spacing:9px; } to { opacity:1; letter-spacing:3.4px; } }
      @keyframes intro-zoom { to { transform:scale(7); opacity:0; } }
      @keyframes intro-gone { to { opacity:0; visibility:hidden; } }
      @media (prefers-reduced-motion: reduce) {
        .intro-orbit, .intro--play .intro-orbit { stroke-dasharray:none; animation:none; }
        .intro-a { display:none; }
        .intro-b, .intro-loop, .intro-rule, .intro-sub, .intro--play .intro-b, .intro--play .intro-loop,
        .intro--play .intro-rule, .intro--play .intro-sub { opacity:1; animation:none; }
        .intro--open { animation-duration:.3s; }
        .intro-logo, .intro--open .intro-logo { animation:none; transform:none; }
      }
    </style>
  </head>
  <body>
    <div id="intro" class="intro" aria-hidden="true">
      <svg class="intro-logo" viewBox="0 0 144 168">
        <defs>
          <linearGradient id="intro-ring-light" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#f0f4f8" /><stop offset=".4" stop-color="#8795a7" />
            <stop offset=".7" stop-color="#dbe2e9" /><stop offset="1" stop-color="#586879" />
          </linearGradient>
          <radialGradient id="intro-violet" cx="30%" cy="25%" r="78%">
            <stop stop-color="#eee6ff" /><stop offset=".45" stop-color="#a69bcc" /><stop offset="1" stop-color="#40365f" />
          </radialGradient>
          <radialGradient id="intro-blue" cx="30%" cy="25%" r="78%">
            <stop stop-color="#e1faff" /><stop offset=".45" stop-color="#95c2cd" /><stop offset="1" stop-color="#305766" />
          </radialGradient>
          <radialGradient id="intro-gold" cx="30%" cy="25%" r="78%">
            <stop stop-color="#fff7d8" /><stop offset=".45" stop-color="#d9cda4" /><stop offset="1" stop-color="#71603a" />
          </radialGradient>
          <radialGradient id="intro-peach" cx="30%" cy="25%" r="78%">
            <stop stop-color="#fff0dc" /><stop offset=".45" stop-color="#e4b797" /><stop offset="1" stop-color="#794d3c" />
          </radialGradient>
        </defs>
        <ellipse class="intro-ground" cx="74" cy="115" rx="45" ry="4" />
        <ellipse class="intro-orbit" cx="75.1" cy="52.2" rx="56.4" ry="50.1" transform="rotate(-6.3 75.1 52.2)" pathLength="100" />
        <ellipse class="intro-orbit inner" cx="70.8" cy="54.2" rx="45.2" ry="33.5" transform="rotate(-20.6 70.8 54.2)" pathLength="100" />
        <!-- A: where each planet stood a little earlier on its orbit; B: where the logo has it. -->
        <g class="intro-a">
          <circle cx="29.9" cy="48" r="2.2" class="intro-planet" fill="url(#intro-violet)" />
          <circle cx="32.2" cy="76.7" r="3.6" class="intro-planet" fill="url(#intro-blue)" />
          <circle cx="58.4" cy="100.5" r="5.9" class="intro-planet" fill="url(#intro-gold)" />
          <circle cx="96.8" cy="98" r="7.3" class="intro-planet" fill="url(#intro-peach)" />
        </g>
        <g class="intro-b">
          <circle cx="45.5" cy="29.3" r="2.2" class="intro-planet" fill="url(#intro-violet)" />
          <circle cx="26.1" cy="62.7" r="3.6" class="intro-planet" fill="url(#intro-blue)" />
          <circle cx="42.4" cy="94.1" r="5.9" class="intro-planet" fill="url(#intro-gold)" />
          <circle cx="85.4" cy="100.8" r="7.3" class="intro-planet" fill="url(#intro-peach)" />
        </g>
        <text class="intro-loop" x="72" y="145" text-anchor="middle">LOOP</text>
        <line class="intro-rule" x1="2" y1="149.5" x2="142" y2="149.5" />
        <text class="intro-sub" x="72" y="165.5" text-anchor="middle">THE DIFFERENCE</text>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
