# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Caddy terminates HTTPS for $DOMAIN (from .env) and proxies to web; web is no longer published.
# Needs Docker Compose >= 2.24 (for "!reset").
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    depends_on:
      - web
    restart: unless-stopped

  web:
    ports: !reset []

  worker:
    deploy:
      replicas: 2

volumes:
  caddy_data:
  caddy_config:
